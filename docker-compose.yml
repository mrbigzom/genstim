services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genstim
      POSTGRES_USER: genstim
      POSTGRES_PASSWORD: genstim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genstim -d genstim"]
      interval: 5s
      timeout:  1s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
